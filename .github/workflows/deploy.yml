name: Validate and smoke-test Render game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: render-game-ci
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exactly as Render installs
        run: npm install --include=dev --no-audit --no-fund
      - name: Verify JavaScript
        run: npm run check
      - name: Build bundled browser game
        run: npm run build
      - name: Smoke-test Node web service
        shell: bash
        run: |
          set -euo pipefail
          node server.js > server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:3000/health > /dev/null; then break; fi
            sleep 1
          done
          echo "Health endpoint:"
          curl -fsS http://127.0.0.1:3000/health
          echo
          curl -fsS http://127.0.0.1:3000/ > /tmp/gwang-index.html
          grep -q '/assets/' /tmp/gwang-index.html
          asset="$(find dist/assets -maxdepth 1 -name '*.js' -printf '%f\n' | head -n 1)"
          test -n "$asset"
          curl -fsS "http://127.0.0.1:3000/assets/$asset" > /dev/null
          curl -fsS http://127.0.0.1:3000/assets/characters/human_animated.glb > /dev/null
          echo "OK: Render-style server, bundled JS and GLB assets respond."
